# NGINX site for one Meteor app (HTTP). Certbot adds the 443 server.
#
# Replace APP_NAME and APP_HOST (example: nexus-govrn, app.example.com).
#
#   sudo cp deploy/nginx/meteor-map.conf /etc/nginx/conf.d/meteor-map.conf
#   sudo cp deploy/nginx/meteor-app.conf /etc/nginx/sites-available/APP_NAME
#   sudo ln -s /etc/nginx/sites-available/APP_NAME /etc/nginx/sites-enabled/APP_NAME
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d APP_HOST
#
# Requires /etc/nginx/conf.d/meteor-map.conf for $connection_upgrade.
# A second app on this host needs its own upstream port and server_name.

upstream meteor_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name app.example.com;

  # @nexus/files default upload cap is 25 MB; leave a little headroom.
  client_max_body_size 26m;

  location / {
    proxy_pass http://meteor_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
  }
}
