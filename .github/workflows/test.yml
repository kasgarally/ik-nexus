# Author: Karmil Asgarally - INTELLEKTRA © 2026
# Package Vitest, GovRN Meteor mocha, and Playwright
name: Test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: packages (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-report
          path: reports/vitest
          if-no-files-found: warn

  meteor:
    name: govrn (Meteor mocha)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache Meteor
        uses: actions/cache@v4
        with:
          path: ~/.meteor
          key: meteor-${{ runner.os }}-${{ hashFiles('apps/nexus-govrn/.meteor/release') }}
      - name: Install Meteor
        run: |
          if [ ! -x "$HOME/.meteor/meteor" ]; then
            curl https://install.meteor.com/ | sh
          fi
          echo "$HOME/.meteor" >> "$GITHUB_PATH"
      - name: Install GovRN npm dependencies
        working-directory: apps/nexus-govrn
        run: meteor npm ci
      - name: Run Meteor mocha (spec reporter)
        working-directory: apps/nexus-govrn
        run: meteor npm test
      - name: Upload mocha log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteor-mocha-log
          path: apps/nexus-govrn/.meteor/local/log
          if-no-files-found: ignore

  e2e:
    name: files gallery (Playwright)
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Cache Meteor
        uses: actions/cache@v4
        with:
          path: ~/.meteor
          key: meteor-${{ runner.os }}-${{ hashFiles('apps/nexus-govrn/.meteor/release') }}
      - name: Install Meteor
        run: |
          if [ ! -x "$HOME/.meteor/meteor" ]; then
            curl https://install.meteor.com/ | sh
          fi
          echo "$HOME/.meteor" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Install GovRN npm dependencies
        working-directory: apps/nexus-govrn
        run: meteor npm ci
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: reports/playwright
          if-no-files-found: warn
