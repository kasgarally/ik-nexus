# Per-app NGINX + Meteor stack (local Mongo is the local-mongo profile)
name: ${APP_NAME}

services:
  mongo:
    profiles: ["local-mongo"]
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - ${MONGO_DATA_DIR}:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  mongo-init:
    profiles: ["local-mongo"]
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: on-failure
    volumes:
      - ./mongo/init-replica.js:/init-replica.js:ro
    command: ["mongosh", "--host", "mongo:27017", "--file", "/init-replica.js"]

  meteor:
    image: ik-nexus/${APP_NAME}:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: ${APP_NAME}
    env_file:
      - path: ./apps/${APP_NAME}.local.env
        required: false
    environment:
      ROOT_URL: ${ROOT_URL}
      PORT: "3000"
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/${MONGO_DB}?replicaSet=rs0}
    depends_on:
      mongo:
        condition: service_healthy
        required: false
      mongo-init:
        condition: service_completed_successfully
        required: false
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  nginx:
    build:
      context: ./nginx
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    environment:
      HTTPS_PORT: ${HTTPS_PORT}
    volumes:
      - ./certs/${APP_NAME}:/etc/nginx/certs:ro
    depends_on:
      meteor:
        condition: service_healthy
